<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a1b26">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Contacts Hub</title><link rel="icon" href="assets/nexus.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/app.css">
</head>
<body data-pane="list">
<a class="skip-link" href="#contact-list">Skip to contacts</a>
<nav class="pane pane-libraries" id="pane-libs" aria-label="Libraries and views">
<div class="pane-header"><div class="header-content"><span>Server Index</span><div class="header-tools"><span id="connection-label" class="server-badge">VFS</span><button id="theme-button" class="icon-button" type="button" aria-label="Switch theme" title="Switch theme"></button><button id="settings-button" class="icon-button" type="button" aria-label="Workspace settings" title="Workspace settings"></button></div></div></div>
<nav id="smart-views" class="smart-views" aria-label="Contact views"></nav>
<div class="library-heading"><h2>Libraries</h2><div id="library-actions"></div></div>
<div id="library-list" class="library-list" aria-label="Available libraries"></div>
<div class="sidebar-footer"><button id="open-button" class="add-source" type="button">Open a source</button><div id="workspace-note"></div></div>
</nav>
<section class="pane pane-list list-pane" aria-labelledby="list-heading">
<div class="pane-header list-header"><button id="library-back" class="nav-back mobile-only" type="button" aria-label="Show libraries"></button><div class="list-title"><span id="list-context" class="list-context">ADDRESS BOOK</span><h2 id="list-heading">All contacts</h2></div><div class="header-actions"><button id="add-contact" class="header-btn" type="button">New</button><button id="source-button" class="header-btn" type="button">Source details</button></div></div>
<div class="search-box"><label class="search-inner"><span id="search-icon" class="search-icon"></span><input id="search" type="search" placeholder="Search name, company, phone or email" autocomplete="off" spellcheck="false" maxlength="256" aria-label="Search contacts"></label><div class="list-meta"><span id="result-count" role="status">Open a library to begin</span><span id="source-status">Sources stay separate</span></div></div>
<div class="list-body"><div id="contact-list" class="contact-list" role="listbox" aria-label="Contacts" tabindex="0"><div id="list-spacer"></div><div id="list-window"></div></div><nav id="alphabet" class="alpha-gutter" aria-label="Jump to a letter"></nav><div id="empty-list" class="empty-list"></div></div>
</section>
<main id="detail-pane" class="pane pane-detail detail-pane" aria-label="Contact details"><div class="detail-empty"><div class="empty-icon" aria-hidden="true">&#128100;</div><h2>Select a Contact</h2><p>Open a library and choose an entry to view its details.</p><button id="welcome-connect" class="text-button" type="button">Connect to the private library</button></div></main>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<dialog id="modal" aria-labelledby="modal-title"><header class="modal-header"><div><div id="modal-kicker" class="eyebrow"></div><h2 id="modal-title"></h2></div><button id="modal-close" class="modal-close" type="button" aria-label="Close dialog"></button></header><div id="modal-body" class="modal-body"></div><footer id="modal-footer" class="modal-footer"></footer></dialog>
<input id="file-input" type="file" accept=".vcf,.csv" multiple hidden><input id="folder-input" type="file" webkitdirectory multiple hidden>
<script type="module" src="js/app.js"></script>
</body></html>
